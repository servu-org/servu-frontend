name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch, e.g., master
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push to gh-pages branch
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Or your preferred Node.js version

      - name: Install Dependencies 📦
        run: npm ci

      - name: Build Next.js App 🏗️
        run: npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out # The directory Next.js exports to
          # Optional: if you have a custom domain
          # cname: your.custom.domain.com
          # Optional: if you want to publish to a specific branch other than gh-pages
          # publish_branch: gh-pages
          # Optional: user name and email for commit
          # user_name: 'github-actions[bot]'
          # user_email: 'github-actions[bot]@users.noreply.github.com'
